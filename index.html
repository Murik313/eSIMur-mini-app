
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>eSIMur</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#080f1c;
    color:#eef6ff;
    font:16px system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
}

main{
    max-width:640px;
    margin:auto;
    padding:24px 18px 120px;
}

h1{
    color:#38bdf8;
    font-size:32px;
    font-weight:800;
    font-style:italic;
    letter-spacing:-1.5px;
    margin:0 0 24px;
}

h2{
    font-size:22px;
    letter-spacing:-.5px;
}

p,small{
    color:#a5b8ce;
    line-height:1.6;
}

.hero{
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at 90% 15%,
        #0ea5e955,transparent 55%),
        linear-gradient(135deg,#123b62,#102036);
    border:1px solid #38bdf830;
    padding:28px 24px;
    border-radius:26px;
    box-shadow:0 12px 32px #00000030;
}

.hero h2{
    font-size:30px;
    line-height:1.2;
    margin:16px 0 10px;
}

.hero small{
    color:#bae6fd;
}

input,select,button{
    font:inherit;
    color:inherit;
}

input,select{
    width:100%;
    background:#111e30;
    border:1px solid #293d55;
    border-radius:16px;
    padding:16px;
    margin-top:12px;
    outline:none;
}

input:focus,select:focus{
    border-color:#38bdf8;
    box-shadow:0 0 0 3px #38bdf820;
}

button{
    cursor:pointer;
    border:1px solid #ffffff08;
    border-radius:16px;
    background:#142236;
    padding:16px;
    text-align:left;
    transition:transform .15s,background .15s;
}

button:active{
    transform:scale(.97);
}

button:disabled{
    opacity:.5;
    cursor:default;
}

button:focus-visible{
    outline:2px solid #38bdf8;
}

.country{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    margin:8px 0;
    min-height:72px;
}

.flag{
    font-size:30px;
}

.price{
    margin-left:auto;
    color:#7dd3fc;
    font-size:14px;
    font-weight:600;
    text-align:right;
}

.popular{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.popular button{
    display:grid;
    gap:10px;
    min-height:140px;
    padding:18px;
    border-radius:22px;
    background:linear-gradient(
        145deg,#1c3550,#111e30
    );
    border:1px solid #38bdf820;
}

.popular .flag{
    font-size:38px;
}

.popular .price{
    margin:0;
    text-align:left;
}

nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:100;
    background:#101b2cf5;
    backdrop-filter:blur(20px);
    display:flex;
    justify-content:center;
    padding:10px 0 max(
        12px,env(safe-area-inset-bottom)
    );
    border-top:1px solid #29384d;
}

nav button{
    background:none;
    border:0;
    text-align:center;
    font-size:12px;
    line-height:1.8;
    flex:1;
    max-width:160px;
    padding:10px 2px;
    color:#94a3b8;
}

nav button.active{
    color:#38bdf8;
    font-weight:700;
}

.note{
    padding:20px;
    border:1px solid #293d55;
    border-radius:22px;
    margin:14px 0;
    background:#111e30;
}

.primary{
    width:100%;
    margin-top:18px;
    background:linear-gradient(
        135deg,#38bdf8,#0ea5e9
    );
    color:#080f1c;
    text-align:center;
    font-weight:750;
    padding:17px;
    box-shadow:0 6px 24px #0ea5e930;
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.stats h2{
    color:#38bdf8;
    font-size:32px;
    margin:12px 0;
}

#connection{
    font-size:12px;
    margin:14px 0 4px;
}

.error{
    color:#fca5a5;
}

[hidden]{
    display:none!important;
}

@media(prefers-reduced-motion:reduce){
    button{transition:none}
    button:active{transform:none}
}
</style>

</head>
<body>
<main>
<h1>eSIMur</h1>

<section id="home">
<div class="hero">
<small id="hello">Добро пожаловать!</small>
<h2>Весь мир на связи 🌍</h2>
<p>Мобильный интернет для путешествий</p>
<small>Тестовый режим · Оплата отключена</small>
</div>

<p id="connection">Подключение к серверу…</p>
<input id="search" type="search" placeholder="Найти страну…" aria-label="Поиск страны">
<select id="region" aria-label="Регион"></select>

<section id="popular">
<h2>Популярные направления</h2>
<div class="popular" id="popularList"></div>
</section>

<h2 id="count"></h2>
<div id="list"></div>
</section>

<section id="detail" hidden>
<button id="back">← Все страны</button>
<h2 id="countryTitle"></h2>
<p id="status"></p>
<div id="plans"></div>
</section>

<section id="other" hidden>
<h2 id="otherTitle"></h2>
<div id="otherText"></div>
</section>
</main>

<nav id="nav">
<button data-tab="home" class="active">⌂<br>Главная</button>
<button data-tab="esim">▣<br>Мои eSIM</button>
<button data-tab="help">?<br>Поддержка</button>
<button data-tab="profile">○<br>Профиль</button>
</nav>

<script>
const API = 'https://api.esimur.com';
const $ = id => document.getElementById(id);
const tg = window.Telegram?.WebApp;

tg?.ready();
tg?.expand();

let tariffs = [];
let catalogReady = false;
let currentTab = 'home';
let creatingOrder = false;

const groups = {
'Европа':'EU AL AD AT BE BA BG BY CH CY CZ DE DK EE ES FI FR GB GR HU IE IS IT LI LT LU LV MC MD ME MK MT NL NO PL PT RO RS SE SI SK SM UA VA XK RU',
'Азия':'AF AM AZ BD BT BN CN GE HK ID IN JP KG KH KR KZ LA LK MM MN MO MV MY NP PK PH SG TH TJ TL TM TW UZ VN',
'Ближний Восток':'AE BH IL IQ IR JO KW LB OM PS QA SA SY TR YE',
'Африка':'DZ AO BJ BW BF BI CV CM CF TD KM CG CD DJ EG GQ ER SZ ET GA GM GH GN GW CI KE LS LR LY MG MW ML MR MU MA MZ NA NE NG RW ST SN SC SL SO ZA SS SD TZ TG TN UG ZM ZW',
'Северная Америка':'AG BS BB BZ CA CR CU DM DO SV GD GT HT HN JM MX NI PA KN LC VC TT US PR',
'Южная Америка':'AR BO BR CL CO EC GY PY PE SR UY VE',
'Океания':'AU FJ KI MH FM NR NZ PW PG WS SB TO TV VU NC PF GU'
};

const names = new Intl.DisplayNames(['ru'],{type:'region'});

const countries = Object.entries(groups)
.flatMap(([region,codes]) =>
codes.split(' ').map(code => ({
code,
region,
name:code === 'EU' ? 'Европа' : names.of(code),
flag:[...code].map(c =>
String.fromCodePoint(127397+c.charCodeAt(0))).join('')
})))
.sort((a,b)=>a.name.localeCompare(b.name,'ru'));

function element(tag,text,className){
const e=document.createElement(tag);
if(text!==undefined)e.textContent=text;
if(className)e.className=className;
return e;
}

function money(value){
return Number(value).toLocaleString('ru-RU')+' ₽';
}

async function api(path,method='GET',auth=true){
const headers={};

if(auth){
if(!tg?.initData){
throw new Error('Откройте приложение через Telegram.');
}
headers['X-Telegram-Init-Data']=tg.initData;
}

const response=await fetch(API+path,{
method,
headers,
cache:'no-store'
});

if(response.status===401){
throw new Error('Авторизация недоступна. Закройте и заново откройте приложение.');
}

if(!response.ok){
throw new Error('Ошибка сервера: '+response.status);
}

return response.json();
}

function show(id){
for(const x of ['home','detail','other']){
$(x).hidden=x!==id;
}
window.scrollTo(0,0);
}

function countryTariffs(code){
return tariffs.filter(t=>t.country_code===code);
}

function countryButton(c,pop=false){
const b=element('button',undefined,pop?'':'country');
const plans=countryTariffs(c.code);

const flag=element('span',c.flag,'flag');
const name=element('span',c.name);
const price=element('span',
plans.length
?'от '+money(Math.min(...plans.map(t=>t.price)))
:catalogReady?'Уточняется':'—',
'price');

b.append(flag,name,price);
b.onclick=()=>openCountry(c);
return b;
}

function render(){
const q=$('search').value.trim().toLocaleLowerCase('ru');
const r=$('region').value;

const filtered=countries.filter(c=>
(!r||c.region===r)&&
(!q||c.name.toLocaleLowerCase('ru').includes(q)
||c.code.toLowerCase()===q));

$('popular').hidden=!!(q||r);
$('count').textContent='Направления: '+filtered.length;

$('list').replaceChildren(
...filtered.map(c=>countryButton(c))
);

if(!filtered.length){
$('list').textContent='Ничего не найдено';
}

$('popularList').replaceChildren(
...['TR','AE','TH','EG','US','EU']
.map(code=>countries.find(c=>c.code===code))
.filter(Boolean)
.map(c=>countryButton(c,true))
);
}

async function loadCatalog(){
try{
const result=await api('/catalog','GET',false);

if(!Array.isArray(result.tariffs)){
throw new Error('Некорректный каталог');
}

tariffs=result.tariffs;
catalogReady=true;
$('connection').textContent='● Сервер подключён';
$('connection').style.color='#4ade80';
render();

}catch(e){
$('connection').textContent='Не удалось загрузить тарифы';
$('connection').className='error';
}
}

async function loadProfile(){
try{
const result=await api('/me');
if(result.first_name){
$('hello').textContent='Привет, '+result.first_name+'!';
}
return result;
}catch(e){
return null;
}
}

function openCountry(c){
show('detail');

$('countryTitle').textContent=c.flag+' '+c.name;
$('plans').replaceChildren();

const plans=countryTariffs(c.code);

$('status').textContent=!catalogReady
?'Каталог пока недоступен.'
:plans.length
?'Тестовые тарифы. Оплата отключена.'
:'Тарифы появятся после подключения поставщика.';

plans.forEach(t=>{
const b=element('button',undefined,'country');
const name=element('span',t.data+' · '+t.days+' дн.');
const price=element('span',money(t.price),'price');

b.append(name,price);
b.onclick=()=>confirmOrder(t);
$('plans').append(b);
});
}

function confirmOrder(t){
$('plans').replaceChildren();

const card=element('div',undefined,'note');

card.append(
element('h2',t.flag+' '+t.country),
element('p','Интернет: '+t.data),
element('p','Срок: '+t.days+' дн.'),
element('h2',money(t.price)),
element('p','Это тестовый заказ. Деньги не списываются.')
);

const button=element('button','Создать тестовый заказ','primary');
const message=element('p','');

button.onclick=async()=>{
if(creatingOrder)return;

creatingOrder=true;
button.disabled=true;
button.textContent='Создание заказа…';

try{
const order=await api(
'/orders?tariff_id='+encodeURIComponent(t.id),
'POST'
);

message.textContent='Тестовый заказ №'+order.order_id+' создан';
button.textContent='Заказ создан';

document.querySelector('[data-tab="esim"]').click();

}catch(e){
message.textContent=e.message;
message.className='error';
button.disabled=false;
button.textContent='Повторить';
}finally{
creatingOrder=false;
}
};

card.append(button,message);
$('plans').append(card);
}

async function renderMyEsim(){
$('otherTitle').textContent='Мои eSIM';
$('otherText').textContent='Загрузка заказов…';
show('other');

try{
const result=await api('/orders');

if(currentTab!=='esim')return;

if(!Array.isArray(result.orders)){
throw new Error('Некорректный список заказов');
}

const orders=result.orders;
const root=$('otherText');
root.replaceChildren();

const hero=element('div',undefined,'hero');
hero.append(
element('small','Личный кабинет eSIMur'),
element('h2','Ваши eSIM'),
element('p','Управляйте интернетом в путешествиях')
);

root.append(hero);

const stats=element('div',undefined,'stats');

const active=element('div',undefined,'note');
active.append(
element('small','Активные eSIM'),
element('h2','0')
);

const tests=element('div',undefined,'note');
tests.append(
element('small','Тестовые заказы'),
element('h2',String(orders.filter(o=>o.status==='test').length))
);

stats.append(active,tests);
root.append(stats);

if(!orders.length){
root.append(element('p','У вас пока нет заказов.'));
}

orders.forEach(o=>{
const card=element('div',undefined,'note');
card.style.background='#142236';

const tariff=tariffs.find(t=>t.country===o.country);
const flag=tariff?.flag||'🌍';

card.append(
element('small','Заказ №'+o.id),
element('h2',flag+' '+o.country),
element('p',o.tariff),
element('p','Стоимость: '+money(o.price)),
element('p','Статус: '+(o.status==='test'
?'Тестовый заказ':o.status))
);

const install=element('div',undefined,'note');
install.style.textAlign='center';

install.append(
element('h2','▦'),
element('p','Установка пока недоступна'),
element('small','Поставщик eSIM ещё не подключён')
);

card.append(install);
root.append(card);
});

const button=element('button','+ Выбрать новую eSIM','primary');
button.onclick=()=>document.querySelector('[data-tab="home"]').click();
root.append(button);

}catch(e){
if(currentTab==='esim'){
$('otherText').textContent=e.message;
}
}
}

async function renderProfile(){
$('otherTitle').textContent='Профиль';
$('otherText').textContent='Проверка авторизации…';
show('other');

const user=await loadProfile();

if(currentTab!=='profile')return;

if(!user){
$('otherText').textContent='Не удалось подтвердить авторизацию Telegram.';
return;
}

const card=element('div',undefined,'note');

card.append(
element('h2',user.first_name||'Пользователь'),
element('p','Telegram ID: '+user.telegram_id),
element('p','Авторизация подтверждена')
);

$('otherText').replaceChildren(card);
}

$('region').add(new Option('Все регионы',''));

Object.keys(groups).forEach(r=>
$('region').add(new Option(r,r))
);

$('search').oninput=render;
$('region').onchange=render;
$('back').onclick=()=>show('home');

document.querySelectorAll('nav button').forEach(b=>{
b.onclick=()=>{
currentTab=b.dataset.tab;

document.querySelectorAll('nav button').forEach(x=>
x.classList.toggle('active',x===b));

if(currentTab==='home'){
show('home');
}else if(currentTab==='esim'){
renderMyEsim();
}else if(currentTab==='profile'){
renderProfile();
}else{
$('otherTitle').textContent='Поддержка';
$('otherText').textContent='Раздел поддержки готовится.';
show('other');
}
};
});

render();
loadCatalog();
loadProfile();
</script>
</body>
</html>
