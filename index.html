<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>eSIMurik | Тарифы</title>
    <!-- Подключаем официальный SDK Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            /* Используем переменные Telegram для поддержки темной/светлой темы */
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --link-color: var(--tg-theme-link-color, #2481cc);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f1f1f1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            padding-bottom: 90px; /* Отступ для нижней кнопки Telegram */
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        .header {
            margin-bottom: 24px;
            animation: fadeIn 0.5s ease-out;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 8px 0;
            font-weight: 700;
        }

        .subtitle {
            color: var(--hint-color);
            font-size: 14px;
            margin: 0;
            line-height: 1.4;
        }

        /* Стили для стран */
        .country-group {
            margin-bottom: 24px;
            animation: slideUp 0.4s ease-out;
        }

        .country-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-left: 4px;
        }

        /* Стили для карточек тарифов */
        .tarif-card {
            background-color: var(--secondary-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border: 2px solid transparent; /* Рамка для выделения */
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .tarif-card:active {
            transform: scale(0.98);
        }

        .tarif-card.selected {
            border-color: var(--button-color);
            background-color: var(--button-color);
            color: var(--button-text-color);
        }

        .tarif-card.selected .tarif-price {
            color: var(--button-text-color);
        }

        .tarif-info {
            font-weight: 500;
            font-size: 15px;
            flex: 1;
        }

        .tarif-price {
            font-weight: 700;
            font-size: 16px;
            color: var(--link-color);
            transition: color 0.2s;
            white-space: nowrap;
            margin-left: 12px;
        }

        /* Анимации */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

        // Переменная для хранения выбранного тарифа

        // 3. Функция отрисовки (оставляем как было, но добавляем логи)

            // Включаем кнопку

            // Лог для проверки

                tg.sendData(JSON.stringify(dataToSend));

                tg.showPopup({

            // Карточки тарифов
            countryBlock.tariffs.forEach(function(tarif) {
                const card = document.createElement('div');
                card.className = 'tarif-card';
                card.innerHTML = `
                    <div class="tarif-info">${tarif.name}</div>
                    <div class="tarif-price">${tarif.price} ₽</div>
                `;

                // Логика при клике на карточку
                card.onclick = function() {
                    // Убираем класс "selected" у всех карточек
                    document.querySelectorAll('.tarif-card').forEach(c => c.classList.remove('selected'));

                    card.classList.add('selected');

                    // Обновляем и показываем главную кнопку

            });

        });

        // 6. Обработка нажатия на главную кнопку Telegram
        mainButton.onClick(function() {

            // Бот получит это сообщение и сможет выставить счет
            const dataToSend = {

            };
