<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>eSIMurik | Тарифы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --link-color: var(--tg-theme-link-color, #2481cc);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f1f1f1);
            --card-border-radius: 16px;
            --card-padding: 16px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            padding-bottom: 100px;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            margin-bottom: 24px;
            animation: fadeIn 0.4s ease-out;
        }

        h1 {
            font-size: 26px;
            margin: 0 0 8px 0;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--hint-color);
            font-size: 15px;
            margin: 0;
            line-height: 1.5;
        }

        .country-group {
            margin-bottom: 28px;
            animation: slideUp 0.4s ease-out;
        }

        .country-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-left: 4px;
        }

        .tarif-card {
            background-color: var(--secondary-bg);
            border-radius: var(--card-border-radius);
            padding: var(--card-padding);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .tarif-card:active {
            transform: scale(0.98);
        }

        .tarif-card.selected {
            border-color: var(--button-color);
            background-color: var(--button-color);
            color: var(--button-text-color);
            box-shadow: 0 4px 12px rgba(36, 129, 204, 0.2);
        }

        .tarif-card.selected .tarif-price {
            color: var(--button-text-color);
        }

        .tarif-info {
            font-weight: 500;
            font-size: 15px;
            flex: 1;
        }

        .tarif-price {
            font-weight: 700;
            font-size: 16px;
            color: var(--link-color);
            transition: color 0.2s;
            white-space: nowrap;
            margin-left: 12px;
        }

        /* Анимации */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Стили для скролла (опционально) */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Привет, <span id="user-name">Гость</span>! 👋</h1>
        <p class="subtitle">Выберите страну и подходящий тариф для путешествий:</p>
    </div>

    <div id="catalog"></div>

    <script>
        // 1. Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready(); // Сообщаем Telegram, что приложение готово

        // Получаем имя пользователя
        try {
            const user = tg.initDataUnsafe?.user;
            if (user && user.first_name) {
                document.getElementById('user-name').innerText = user.first_name;
            }
        } catch(e) {
            console.log("Имя не получено", e);
        }

        // 2. Настройка Главной кнопки
        const mainButton = tg.MainButton;
        mainButton.setText('Выберите тариф');
        mainButton.hide();
        mainButton.disable();
        mainButton.color = tg.themeParams.button_color || '#2481cc';
        mainButton.textColor = tg.themeParams.button_text_color || '#ffffff';

        // 3. База данных тарифов (ваши данные)
        const catalogData = [
            {
                country: "🇹🇷 Турция",
                tariffs: [
                    { name: "Unlimited 3 days", price: 500 },
                    { name: "Unlimited 7 days", price: 1000 },
                    { name: "Unlimited 14 days", price: 1800 },
                    { name: "Unlimited 30 days", price: 3000 },
                    { name: "5 GB - 30 days", price: 340 },
                    { name: "10 GB - 30 days", price: 620 },
                    { name: "20 GB - 30 days", price: 1190 }
                ]
            },
            {
                country: "🇦🇪 ОАЭ",
                tariffs: [
                    { name: "Unlimited 1 day", price: 400 },
                    { name: "Unlimited 3 days", price: 1000 },
                    { name: "Unlimited 7 days", price: 2400 },
                    { name: "5 GB - 30 days", price: 1180 },
                    { name: "10 GB - 30 days", price: 2280 },
                    { name: "20 GB - 30 days", price: 4480 }
                ]
            },
            {
                country: "🇻🇳 Вьетнам",
                tariffs: [
                    { name: "Unlimited 1 day", price: 170 },
                    { name: "Unlimited 3 days", price: 330 },
                    { name: "Unlimited 7 days", price: 710 },
                    { name: "5 GB - 30 days", price: 500 },
                    { name: "10 GB - 30 days", price: 750 },
                    { name: "20 GB - 30 days", price: 1330 }
                ]
            },
            {
                country: "🇰🇿 Казахстан",
                tariffs: [
                    { name: "Unlimited 1 day", price: 310 },
                    { name: "Unlimited 3 days", price: 640 },
                    { name: "Unlimited 7 days", price: 1310 },
                    { name: "5 GB - 30 days", price: 730 },
                    { name: "10 GB - 30 days", price: 1250 },
                    { name: "20 GB - 30 days", price: 2200 }
                ]
            },
            {
                country: "🇹🇲 Туркменистан",
                tariffs: [
                    { name: "Unlimited 1 day", price: 310 },
                    { name: "Unlimited 3 days", price: 640 },
                    { name: "Unlimited 7 days", price: 1310 },
                    { name: "5 GB - 30 days", price: 800 },
                    { name: "10 GB - 30 days", price: 1250 },
                    { name: "20 GB - 30 days", price: 1480 }
                ]
            },
            {
                country: "🇹🇭 Таиланд",
                tariffs: [
                    { name: "Unlimited 1 day", price: 210 },
                    { name: "Unlimited 3 days", price: 670 },
                    { name: "Unlimited 7 days", price: 1400 },
                    { name: "5 GB - 30 days", price: 570 },
                    { name: "10 GB - 30 days", price: 1000 },
                    { name: "20 GB - 30 days", price: 2170 }
                ]
            },
            {
                country: "🇨🇳 Китай",
                tariffs: [
                    { name: "Unlimited 1 day", price: 400 },
                    { name: "Unlimited 3 days", price: 810 },
                    { name: "Unlimited 7 days", price: 1670 },
                    { name: "5 GB - 30 days", price: 630 },
                    { name: "10 GB - 30 days", price: 1250 },
                    { name: "20 GB - 30 days", price: 2180 }
                ]
            },
            {
                country: "🇺🇸 США",
                tariffs: [
                    { name: "Unlimited 1 day", price: 210 },
                    { name: "Unlimited 3 days", price: 540 },
                    { name: "Unlimited 7 days", price: 1250 },
                    { name: "5 GB - 30 days", price: 700 },
                    { name: "10 GB - 30 days", price: 1290 },
                    { name: "20 GB - 30 days", price: 2340 }
                ]
            },
            {
                country: "🇯🇵 Япония",
                tariffs: [
                    { name: "Unlimited 1 day", price: 1010 },
                    { name: "Unlimited 3 days", price: 2870 },
                    { name: "Unlimited 7 days", price: 6580 },
                    { name: "5 GB - 30 days", price: 1650 },
                    { name: "10 GB - 30 days", price: 3290 },
                    { name: "20 GB - 30 days", price: 6580 }
                ]
            },
            {
                country: "🇦🇲 Армения",
                tariffs: [
                    { name: "Unlimited 1 day", price: 340 },
                    { name: "Unlimited 3 days", price: 1030 },
                    { name: "Unlimited 7 days", price: 2270 },
                    { name: "5 GB - 30 days", price: 1040 },
                    { name: "10 GB - 30 days", price: 1790 },
                    { name: "20 GB - 30 days", price: 3070 }
                ]
            }
        ];

        let selectedTarif = null;

        // 4. Отрисовка каталога
        const catalogContainer = document.getElementById('catalog');
        catalogContainer.innerHTML = '';

        catalogData.forEach(function(countryBlock) {
            const countryGroup = document.createElement('div');
            countryGroup.className = 'country-group';

            const header = document.createElement('div');
            header.className = 'country-header';
            header.innerText = countryBlock.country;
            countryGroup.appendChild(header);

            countryBlock.tariffs.forEach(function(tarif) {
                const card = document.createElement('div');
                card.className = 'tarif-card';
                card.innerHTML = `
                    <div class="tarif-info">${tarif.name}</div>
                    <div class="tarif-price">${tarif.price} ₽</div>
                `;

                card.onclick = function() {
                    document.querySelectorAll('.tarif-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');

                    selectedTarif = {
                        country: countryBlock.country,
                        name: tarif.name,
                        price: tarif.price
                    };

                    mainButton.setText(`Купить за ${tarif.price} ₽`);
                    mainButton.enable();
                    mainButton.show();

                    // Тактильная отдача
                    if (tg.HapticFeedback) {
                        tg.HapticFeedback.impactOccurred('light');
                    }
                };

                countryGroup.appendChild(card);
            });

            catalogContainer.appendChild(countryGroup);
        });

        // 5. Обработка нажатия на Главную кнопку
        mainButton.onClick(function() {
            if (!selectedTarif) {
                tg.showAlert("Пожалуйста, выберите тариф!");
                return;
            }

            const dataToSend = {
                action: "buy_esim",
                country: selectedTarif.country,
                tarif: selectedTarif.name,
                price: selectedTarif.price
            };

            try {
                // Отправляем данные боту
                tg.sendData(JSON.stringify(dataToSend));
                
                // Показываем уведомление об успехе
                tg.showPopup({
                    title: "✅ Заказ оформлен",
                    message: `Вы выбрали: ${selectedTarif.country}\nТариф: ${selectedTarif.name}\nЦена: ${selectedTarif.price} ₽`,
                    buttons: [{type: "ok"}]
                });
            } catch (e) {
                console.error("Ошибка отправки:", e);
                tg.showAlert("Не удалось отправить данные. Попробуйте ещё раз.");
            }
        });
    </script>
</body>
</html>
