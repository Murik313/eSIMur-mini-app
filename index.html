<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>eSIMurik Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Стили для приложения */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            padding-bottom: 90px; /* Отступ снизу, чтобы кнопка не перекрывала контент */
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        
        h1 { font-size: 22px; margin-top: 10px; margin-bottom: 20px; }
        
        /* Стили для карточек стран */
        .country-card {
            background-color: var(--tg-theme-secondary-bg-color, #f1f1f1);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .country-name { font-weight: 600; font-size: 16px; }
        .country-data { font-size: 13px; color: gray; margin-top: 4px; }
        .country-price { font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>
    <h1>Привет, <span id="user-name">гость</span>! 👋</h1>
    <p style="color: gray; margin-top: -10px; margin-bottom: 20px;">Выберите подходящий тариф для путешествий:</p>

    <!-- Список стран -->
    <div class="country-card" onclick="selectCountry('Турция', 500)">
        <div>
            <div class="country-name">🇹🇷 Турция</div>
            <div class="country-data">10 GB • 15 дней</div>
        </div>
        <div class="country-price">500 ₽</div>
    </div>

    <div class="country-card" onclick="selectCountry('США', 1200)">
        <div>
            <div class="country-name">🇺🇸 США</div>
            <div class="country-data">20 GB • 30 дней</div>
        </div>
        <div class="country-price">1200 ₽</div>
    </div>

    <div class="country-card" onclick="selectCountry('Европа', 800)">
        <div>
            <div class="country-name">🇪🇺 Европа (30 стран)</div>
            <div class="country-data">5 GB • 14 дней</div>
        </div>
        <div class="country-price">800 ₽</div>
    </div>

    <script>
        // 1. Инициализация
        const tg = window.Telegram.WebApp;
        tg.expand(); // На весь экран
        tg.setHeaderColor('secondary_bg_color'); // Красим шапку под цвет фона

        // Выводим имя пользователя
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-name').innerText = user.first_name;
        }

        // 2. Настройка Главной кнопки (MainButton)
        const mainButton = tg.MainButton;
        mainButton.setText("Выберите тариф");
        mainButton.show(); // Показываем кнопку внизу
        mainButton.disable(); // Делаем ее неактивной, пока не выбран тариф

        // 3. Логика выбора страны
        let selectedCountry = null;

        function selectCountry(country, price) {
            selectedCountry = { country, price };
            
            // Меняем текст на главной кнопке
            mainButton.setText(`Купить за ${price} ₽`);
            mainButton.enable(); // Делаем кнопку активной (синей)
            mainButton.color = "#2481cc"; // Цвет кнопки
            
            // Показываем всплывающее уведомление (опционально)
            tg.showAlert(`Вы выбрали: ${country}\nК оплате: ${price} ₽`);
        }

        // 4. Обработка нажатия на кнопку "Купить"
        mainButton.onClick(function() {
            if (selectedCountry) {
                // Здесь мы показываем, что кнопка нажата. 
                // В будущем здесь будет код отправки данных на сервер для оплаты.
                tg.showAlert(`Отправка счета на оплату ${selectedCountry.price} ₽...`);
                
                // Пример: отправка данных обратно в бота (если бот на Python/Node.js)
                // 
                tg.sendData(JSON.stringify(selectedCountry));
            }
        });
    </script>
</body>
</html>
